<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <!-- We are using v0.185.1, this script imports from a CDN-->
    <script type="importmap">
        {
           "imports": {
             "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
           }
         }
    </script>
    <title>Heist</title>
</head>
<body>
    <div id="loginView">
        <header>
            <h1>Heist</h1>
            <h2>Login</h2>
        </header>
        <main>
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email" required>
                    <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password" required>
                    <div id="loginStatus" class="small text-danger"></div>
                    <button type="submit" id="submitButton" class="btn btn-primary">Log in</button>
                    <button type="button" class="btn btn-secondary"
                            data-bs-toggle="modal" data-bs-target="#registerModal">
                        Create account
                    </button>

                </div>
            </form>
        </main>
    </div>

    <div id="lobbyView" hidden>
        <h2>Lobby</h2>
        <label>Level: <select id="levelPicker"></select></label>
        <button id="createBtn">Create Game</button>
        <h3>Open Games</h3>
        <ul id="roomList"></ul>
        <button id="logoutBtn" class="btn btn-sm btn-outline-light">Log out</button>
    </div>

    <div id="waitingView" hidden>
        <h2>Waiting Room</h2>
        <p>Room code: <span id="roomCodeLabel"></span></p>
        <div id="waitingGrid">
            <div id="rosterPanel" class="wPanel">
                <h3>Players</h3>
                <ul id="rosterList"></ul>
            </div>
            <div id="chatPanel" class="wPanel">
                <h3>Chat</h3>
                <div id="chatBox">TBD</div>
            </div>
        </div>

        <button id="startBtn" hidden>Start Game</button>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-2">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="regUsername" required
                                   pattern="[A-Za-z0-9_]{3,20}" title="3–20 letters, numbers, or underscore">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPassword" required>
                            <div class="form-text">16+ chars, with upper, lower, number, and symbol.</div>
                        </div>
                        <div id="registerStatus" class="small"></div>
                        <button type="submit" class="btn btn-primary mt-2">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="gameView" hidden>
        <!--TOP BAR-->
        <div id="titlebar" class="position-fixed top-0 start-0 end-0 d-flex align-items-center justify-content-between px-4 py-2" style="z-index:5;">
            <div class="d-flex align-items-center gap-3">
                <span class="bar-logo h2" aria-label="Heist Game">Heist</span>
                <span class="bar-title h4">Test Game <span class="bar-subtitle h6">Gameplay</span></span>
            </div>
        </div>
        <div class="horizontal-line"></div>
        <canvas id="heist-canvas"></canvas>
        <div id="winBanner" hidden>
            <div class="win-card">Heist Complete</div>
            <button class="toLobby">Back to Lobby</button>
        </div>
        <div id="loseBanner" hidden>
            <div class="lose-card">Heist Failed</div>
            <button class="toLobby">Back to Lobby</button>
        </div>
    </div>
    <!--SignalR CDN-->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <!--Auth js-->
    <script type="module" src="auth/register.js"></script>
    <!--Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--Added main.js-->
    <script type="module" src="/main.js"></script>
</body>
</html>
